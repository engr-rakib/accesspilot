# File descriptor cache — reduces open()/stat() syscalls on every request
open_file_cache          max=1000 inactive=30s;
open_file_cache_valid    60s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# TCP optimizations
tcp_nopush on;

# Rate limiting zones (http context)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Strip cache-busting _=timestamp from query string for consistent cache keys
map $args $cache_args {
    "~^(.*)&_=[^&]*$"            $1;
    "~^_=[^&]*&(.*)$"            $1;
    "~^(.*)&_=[^&]*&(.*)$"       $1&$2;
    "~^_=[^&]*$"                 "";
    default                       $args;
}

# FastCGI cache (http context)
fastcgi_cache_path /var/cache/nginx/fastcgi_cache levels=1:2 keys_zone=fcgi:10m inactive=5m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$uri?$cache_args";
fastcgi_cache_use_stale error timeout invalid_header updating http_403 http_404 http_429 http_500 http_503;

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Nginx status (internal only)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.18.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main server
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # SSL
    ssl_certificate     /data/secure/ssl/accesspilot.crt;
    ssl_certificate_key /data/secure/ssl/accesspilot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    # OCSP stapling — skip for self-signed certs (no issuer chain)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 1.1.1.1 valid=300s;
    # resolver_timeout 5s;

    # Security headers
    include /etc/nginx/security-headers.conf;

    # Cache status header (for debugging)
    add_header X-Cache-Status $upstream_cache_status;

    # Root
    root /var/www/html/public;
    index index.php login.php;

    # Timeouts & buffers
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 128k;

    # Static assets — no access log, high rate limit
    location /resources/ {
        access_log off;
        limit_req zone=static burst=50 nodelay;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
    location /assets/ {
        access_log off;
        limit_req zone=static burst=50 nodelay;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
    location /vendor/ {
        access_log off;
        limit_req zone=static burst=50 nodelay;
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Nginx status (internal monitoring)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.18.0.0/16;
        deny all;
    }

    # X-Accel-Redirect internal locations
    location /_xaccel/avatar/ {
        internal;
        alias /data/secure/profile_img/;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
        expires 7d;
    }

    # Health check (cached 5s)
    location /health {
        access_log off;
        limit_req zone=api burst=5 nodelay;
        fastcgi_cache fcgi;
        fastcgi_cache_valid 200 5s;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        include fastcgi_params;
    }

    # Login — strict rate limit, no cache
    location ~ ^/(login|auth)($|\.php) {
        limit_req zone=login burst=3 nodelay;
        limit_conn conn_limit 5;
        client_max_body_size 1M;
        fastcgi_no_cache     $http_pragma $http_authorization;
        fastcgi_cache_bypass $http_pragma $http_authorization;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "display_errors=off";
        fastcgi_read_timeout 120s;
    }

    # Main app
    location / {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit 10;
        client_max_body_size 1M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API — forced cache 5s (ignores PHP no-cache headers)
    location ~ ^/api/index\.php$ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit 10;
        fastcgi_cache fcgi;
        fastcgi_cache_valid 200 5s;
        fastcgi_cache_methods GET HEAD;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "display_errors=off";
        fastcgi_read_timeout 120s;
    }

    # PHP (respects PHP cache headers, cached 5s if no no-cache sent)
    location ~ \.php$ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit 10;
        fastcgi_cache fcgi;
        fastcgi_cache_valid 200 5s;
        fastcgi_cache_methods GET HEAD;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "display_errors=off";
        fastcgi_read_timeout 120s;
    }

    # Block sensitive paths
    location ~ ^/(app|bootstrap|config|scripts|App_Data)/ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* (wp-admin|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|adminer|\.env|\.git|\.svn|\.hg|composer\.json|package\.json|Gruntfile|artisan|Dockerfile|docker-compose\.yml|\.bak|\.swp|\.sql|\.log|\.tar\.gz|setup\.php|install\.php|cgi-bin) {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/error.log;
}
